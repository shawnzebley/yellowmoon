<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yellowmoon">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Yellowmoon</title>
</head>
<body>
  <header>
    <span class="brand">Yellowmoon</span>
    <span id="status" role="status" aria-live="polite">Loading…</span>
  </header>

  <main>
    <section id="stage" aria-label="Photo">
      <div id="empty">
        <p>Open a Sony ARW file to start.</p>
        <p class="hint">Pick it from the Files app. Photos often hands over a JPEG copy instead of the raw.</p>
      </div>
      <img id="preview" alt="Preview of the photo" hidden>
      <div id="busy" hidden><div class="spinner"></div></div>
    </section>

    <section id="controls" aria-label="Adjustments" hidden>
      <div class="group">
        <h2>Look</h2>
        <div class="chips" id="look" role="radiogroup" aria-label="Look">
          <button data-v="signature" aria-checked="true" role="radio">Signature</button>
          <button data-v="neutral" aria-checked="false" role="radio">Neutral</button>
        </div>
        <label class="row">Intensity <output></output><input type="range" id="intensity" min="0" max="100" value="100"></label>
      </div>

      <div class="group">
        <h2>Light</h2>
        <label class="row">Exposure <output></output><input type="range" id="exposure" min="-3" max="3" step="0.1" value="0" data-unit=" EV"></label>
        <label class="row">Contrast <output></output><input type="range" id="contrast" min="-100" max="100" value="0"></label>
        <label class="row">Highlights <output></output><input type="range" id="highlights" min="-100" max="100" value="0"></label>
        <label class="row">Shadows <output></output><input type="range" id="shadows" min="-100" max="100" value="0"></label>
        <label class="row">White point <output></output><input type="range" id="white" min="-100" max="100" value="0"></label>
        <label class="row">Black point <output></output><input type="range" id="black" min="-100" max="100" value="0"></label>
      </div>

      <div class="group">
        <h2>Colour</h2>
        <div class="chips" id="light" role="radiogroup" aria-label="White balance">
          <button data-v="auto" aria-checked="true" role="radio">Auto</button>
          <button data-v="day" aria-checked="false" role="radio">Day</button>
          <button data-v="shade" aria-checked="false" role="radio">Shade</button>
          <button data-v="tungsten" aria-checked="false" role="radio">Tungsten</button>
          <button data-v="fluorescent" aria-checked="false" role="radio">Fluorescent</button>
          <button data-v="led" aria-checked="false" role="radio">LED</button>
          <button data-v="custom" aria-checked="false" role="radio">Custom</button>
        </div>
        <div id="wb-custom" hidden>
          <label class="row">Temperature <output></output><input type="range" id="kelvin" min="2000" max="11000" step="50" value="5600" data-unit=" K"></label>
          <label class="row">Tint <output></output><input type="range" id="tint" min="-50" max="50" value="0"></label>
        </div>
        <label class="row">Saturation <output></output><input type="range" id="saturation" min="-100" max="100" value="0"></label>
      </div>

      <div class="group">
        <h2>Lens</h2>
        <div class="chips" id="lens" role="radiogroup" aria-label="Lens">
          <button data-v="" aria-checked="true" role="radio">None</button>
          <button data-v="default" aria-checked="false" role="radio">Default</button>
          <button data-v="classic" aria-checked="false" role="radio">Classic</button>
          <button data-v="vintage" aria-checked="false" role="radio">Vintage</button>
          <button data-v="petzval" aria-checked="false" role="radio">Petzval</button>
          <button data-v="triplet" aria-checked="false" role="radio">Triplet</button>
          <button data-v="sonnar" aria-checked="false" role="radio">Sonnar</button>
          <button data-v="detuned" aria-checked="false" role="radio">Detuned</button>
        </div>
        <div id="lens-amounts" hidden>
          <label class="row">Flares <output></output><input type="range" id="flares" min="0" max="100" value="50"></label>
          <label class="row">Edges <output></output><input type="range" id="edges" min="0" max="100" value="50"></label>
          <label class="row">Anamorphic <output></output><input type="range" id="anamorphic" min="0" max="100" value="0"></label>
        </div>
      </div>

      <div class="group">
        <h2>Export</h2>
        <div class="chips" id="format" role="radiogroup" aria-label="Format">
          <button data-v="jpeg" aria-checked="true" role="radio">JPEG</button>
          <button data-v="tiff" aria-checked="false" role="radio">TIFF 16-bit</button>
        </div>
        <div class="chips" id="size" role="radiogroup" aria-label="Size">
          <button data-v="" aria-checked="true" role="radio">Full size</button>
          <button data-v="4096" aria-checked="false" role="radio">4096 px</button>
          <button data-v="2048" aria-checked="false" role="radio">2048 px</button>
        </div>
      </div>

      <p class="foot">Everything runs on this phone. Nothing is uploaded.</p>
    </section>
  </main>

  <nav>
    <label class="btn" id="open-btn" aria-disabled="true">Open<input type="file" id="file" accept=".arw,.ARW,image/x-sony-arw" hidden disabled></label>
    <button class="btn" id="reset" disabled>Reset</button>
    <button class="btn primary" id="export" disabled>Export</button>
    <button class="btn primary" id="save" hidden>Save</button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
