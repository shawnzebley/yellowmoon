name: Yellowmoon
options:
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  Yellowmoon:
    type: application
    platform: iOS
    sources:
      - App
      - path: .build/Resources/data
        type: folder
        buildPhase: resources
      - path: .build/Resources/LICENSE
        buildPhase: resources
      - path: .build/Resources/NOTICE
        buildPhase: resources
      - path: .build/Resources/THIRD-PARTY.md
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.shawnzebley.yellowmoon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Yellowmoon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/YellowmoonBridge.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/.build/$(PLATFORM_NAME)"
        OTHER_LDFLAGS:
          - "-lym_mobile"
          - "-framework"
          - Metal
          - "-framework"
          - QuartzCore
          - "-framework"
          - CoreFoundation
          - "-framework"
          - CoreGraphics
          - "-framework"
          - Foundation
          - "-lobjc"
          - "-liconv"
schemes:
  Yellowmoon:
    build:
      targets:
        Yellowmoon: all
